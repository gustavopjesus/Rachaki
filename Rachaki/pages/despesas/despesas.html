<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../inicio/inicio.css">
    <link rel="stylesheet" href="despesas.css">
    <title>Despesas | Rachaki</title>
</head>
<body>
     <header class="cabecalho">
        <div class="logo">
            <img src="../../logo.png" alt="Logo Rachaki">
            <h2>Rachaki</h2>
        </div>

         <nav>
            <a href="../inicio/inicio.html">Início</a>
            <a href="despesas.html">Despesas</a>
            <a href="../relatorio/relatorio.html">Relatório</a>
            <a href="../comoFunciona/comoFunciona.html">Como funciona</a>
            <a href="../login/login.html">Entrar</a>
        </nav>
    </header>
    <main>
        <section class="cartao">
            <h2>Participantes</h2>
            <div class="linha-formulario">
                <input id = "nome-participante" type = "text" placeholder="Nome do participante">
                <button id="botao-participante" type="button">Adicionar</button>
            </div>
            <div id="lista-participantes" class="etiquetas" ></div>
        </section>
        <section class="cartao">
            <div class="linha-formulario">
                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input id="descricao" type="text" placeholder="Ex.: Mercado">
                 </div>
                 <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input id="valor" type="number" step="0.01" placeholder="200,00">
                 </div>
                 <div class="campo">
                    <label for="quem-pagou">Quem pagou</label>
                    <select id="quem-pagou"></select>
                 </div>
                 <button id="botao-gasto" type="button">Adicionar</button>
            </div>
        </section>
        <section class="cartao">
            <table>
                <thead>
                <tr>
                    <th>Descrição</th>
                    <th>Pagou</th>
                    <th>Valor</th>
                    <th class="total">Total: R$ <span id="total">0,00</span></th>
                </tr>
                </thead>
                <tbody id="corpo-tabela">

                </tbody>
            </table>
        </section>
    </main>
    <footer></footer>
    <script src="despesas.js"></script>
</body>
</html>
