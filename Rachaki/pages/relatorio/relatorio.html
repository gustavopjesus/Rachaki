<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../inicio/inicio.css">
    <link rel="stylesheet" href="relatorio.css">
    <title>Relatório | Rachaki </title>
</head>
<body>
     <header class="cabecalho">
        <div class="logo">
            <img src="../../logo.png" alt="Logo Rachaki">
            <h2>Rachaki</h2>
        </div>

         <nav>
            <a href="../inicio/inicio.html">Início</a>
            <a href="../despesas/despesas.html">Despesas</a>
            <a href="relatorio.html">Relatório</a>
            <a href="../comoFunciona/comoFunciona.html">Como funciona</a>
            <a href="../login/login.html">Entrar</a>
        </nav>
    </header>
    <main>
        <section class="resumo">
            <div class="cartao">
                <p class="resumo-titulo">Total gasto</p>
                <p class="resumo-valor" id="total-gasto">0</p>
            </div>
            <div class="cartao">
                <p class="resumo-titulo">Participantes</p>
                <p class="resumo-valor" id="total-participantes">0</p>
            </div>
            <div class="cartao">
                <p class="resumo-titulo">Por pessoa</p>
                <p class="resumo-valor" id="por-pessoa">0</p>
            </div>
        </section>
        <section class="cartao">
                <div class="topo-tabela">
                    <h2>Acerto entre participantes</h2>
                    <button id="novo-racha" type="button">Novo racha</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Participante</th>
                            <th>Pagou</th>
                            <th>Saldo</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela">

                    </tbody>
                </table>
        </section>
    </main>
    <footer></footer>
    <script src="relatorio.js"></script>
</body>
</html>
